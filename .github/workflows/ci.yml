# Intégration continue — point 63.
#
# Trois outils ne servent à rien s'il faut penser à les lancer. Ce workflow
# est le seul endroit où « prouvé par exécution réelle » devient une
# contrainte plutôt qu'une habitude : la suite démarre de vrais serveurs
# éphémères et exécute le vrai dialogue, elle est donc lente — c'est assumé.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # La borne basse déclarée dans pyproject.toml, et une version
        # récente : entre les deux, rien à surveiller.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov ruff

      - name: Linter (jeu de règles de pyproject.toml)
        run: ruff check src tests

      - name: Suite complète, avec couverture
        run: python -m pytest tests/ -q --cov=src --cov-report=term-missing
