# Intégration continue — point 63.
#
# Trois outils ne servent à rien s'il faut penser à les lancer. Ce workflow
# est le seul endroit où « prouvé par exécution réelle » devient une
# contrainte plutôt qu'une habitude : la suite démarre de vrais serveurs
# éphémères et exécute le vrai dialogue, elle est donc lente — c'est assumé.
name: CI

# Sur TOUTES les branches, pas seulement main : une CI qui ne se déclenche
# qu'à la fusion arrive trop tard pour servir. Les pull requests rejouent
# donc la même chose une seconde fois — un doublon assumé, le retour
# immédiat vaut mieux que l'élégance du graphe d'exécutions.
on: [push, pull_request]

jobs:
  verifier:
    runs-on: ubuntu-latest
    env:
      MONL_TEST_DATABASE_URL: postgresql://postgres:monl@127.0.0.1:5432/monltest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: monl
          POSTGRES_DB: monltest
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d monltest"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    strategy:
      fail-fast: false
      matrix:
        # La borne basse déclarée dans pyproject.toml, une version supportée
        # intermédiaire et la version récente éprouvée localement.
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Node n'est pas une dépendance du produit : il ANALYSE le JavaScript
      # que les pages servent. Sans lui, tests/test_console_javascript.py
      # échoue au lieu de sauter — un saut dirait « rien à vérifier ici »
      # alors qu'il dirait « je n'ai pas vérifié » (point 140). Il est déclaré
      # ici, là où la CI l'installe, exactement comme Pillow au point 158bis.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"  # paquet + outils + PostgreSQL réel

      # Ce que la suite ne dit pas : que le paquet s'installe et que la
      # commande existe. Un dépôt vert dont le 'pip install' échoue n'est
      # utilisable que par son auteur (point 65).
      - name: Le paquet s'installe et la commande répond
        run: |
          monl --help
          cd "$(mktemp -d)" && python -c "import monl; print(monl.__version__)"
          # La plateforme et le serveur MCP sont livrés par le PAQUET, pas
          # seulement présents dans l'arbre de travail. Un motif `.gitignore`
          # non ancré avait fait disparaître src/monl_platform/app.py du dépôt
          # sans un mot : `monl-platform` ne démarrait plus, et aucune étape
          # d'ici ne le voyait — seule la suite l'a dit, en s'arrêtant à la
          # collecte. Deux lignes ferment la porte au bon niveau.
          cd "$(mktemp -d)" && python -c "import monl_platform.app, monl_platform.mcp_server"

      - name: Linter (jeu de règles de pyproject.toml)
        run: ruff check src tests

      - name: Contrat IR strictement typé
        run: python -m mypy src/monl/ir.py src/monl/ir_types.py src/monl/planning.py src/monl/policies.py src/monl/errors.py src/monl/generator/emitters.py --strict

      - name: Recherche de code mort (confiance haute)
        run: vulture src/monl --min-confidence 90

      - name: Suite complète, en mesurant les DEUX paquets
        # `--cov-fail-under=0` n'abaisse aucune exigence : les barrières sont
        # tirées de cette exécution à l'étape suivante, une par paquet. Sans
        # ce 0, la barrière de `pyproject.toml` s'appliquerait au TOTAL des
        # deux paquets — un nombre qui ne veut rien dire, et qui laisserait un
        # paquet compenser l'autre.
        #
        # PAS de `-q` ici : `pyproject.toml` en pose déjà un dans `addopts`, et
        # deux `-q` valent `-qq`, qui SUPPRIME la ligne de décompte et la
        # section de résumé. Un saut ne se voyait alors que comme un `s` perdu
        # au milieu d'un mur de points — c'est ainsi que le saut de Pillow a
        # vécu dans cette CI sans que personne ne le lise. `-rs` NOMME chaque
        # test sauté avec son motif : un saut ne dit pas « rien à vérifier
        # ici », il dit « je n'ai pas vérifié » (point 140).
        run: >-
          python -m pytest tests/ -rs --cov=src/monl --cov=src/monl_platform
          --cov-report=term-missing --cov-fail-under=0

      - name: Deux barrières à 90 %, tirées de la MÊME exécution
        # La plateforme était mesurée sur une LISTE DE FICHIERS écrite à la
        # main (`tests/test_platform_*.py tests/test_oauth.py …`). Mesuré :
        # cinq fichiers l'exerçaient hors de cette liste, dont
        # `tests/test_console_javascript.py` qui garde les pages mortes du
        # point 163 — leurs lignes ne comptaient pas dans les 90 %, et un test
        # rangé sous un autre nom en serait sorti sans un mot (point 169).
        #
        # `coverage report --include=…` relit les données de l'étape
        # précédente : la suite tourne UNE fois, chaque paquet garde SA
        # barrière, et il n'y a plus de liste à tenir à jour. La portée reste
        # celle du point 63 — `src/monl` et non `src/` — mais elle est
        # désormais exprimée par paquet plutôt que par sélection de tests.
        run: |
          python -m coverage report --include='src/monl/*' --fail-under=90
          python -m coverage report --include='src/monl_platform/*' --fail-under=90
