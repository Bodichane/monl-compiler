# Continuous integration — point 63.
#
# Three tools are useless if one has to remember to run them. This workflow
# is the only place where "proven by real execution" becomes a constraint
# rather than a habit: the suite starts real ephemeral servers and runs the
# real dialogue, so it is slow — on purpose.
name: CI

# On ALL branches, not only main: a CI that only fires on merge arrives
# too
# late to be useful. Pull requests therefore replay the same thing a
# second
# time — an assumed duplicate, immediate feedback beats an elegant run
# graph.
on: [push, pull_request]

jobs:
  verifier:
    runs-on: ubuntu-latest
    env:
      MONL_TEST_DATABASE_URL: postgresql://postgres:monl@127.0.0.1:5432/monltest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: monl
          POSTGRES_DB: monltest
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d monltest"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    strategy:
      fail-fast: false
      matrix:
        # The lower bound declared in pyproject.toml, an intermediate
        # supported
        # version and the recent version exercised locally.
        python-version: ["3.10", "3.12", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Node is not a product dependency: it PARSES the JavaScript the pages
      # serve.
      # Without it, tests/test_console_javascript.py fails instead of skipping
      # — a
      # skip would say "nothing to check here" when it means "I did not check"
      # (point 140). It is declared here, where CI installs it, exactly like
      # Pillow
      # at point 158bis.
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"  # paquet + outils + PostgreSQL réel

      # What the suite does not say: that the package installs and the
      # command
      # exists. A green repository whose 'pip install' fails is usable
      # only by its
      # author (point 65).
      - name: Le paquet s'installe et la commande répond
        run: |
          monl --help
          cd "$(mktemp -d)" && python -c "import monl; print(monl.__version__)"
          # The platform and the MCP server are shipped by the PACKAGE, not
          # only
          # present in the working tree. An unanchored `.gitignore` pattern
          # had made
          # src/monl_platform/app.py vanish from the repository without a
          # word:
          # `monl-platform` no longer started, and no step here saw it — only
          # the suite
          # said so, by stopping at collection. Two lines close the door at
          # the right
          # level.
          cd "$(mktemp -d)" && python -c "import monl_platform.app, monl_platform.mcp_server"

      - name: Linter (jeu de règles de pyproject.toml)
        run: ruff check src tests

      - name: Contrat IR strictement typé
        run: python -m mypy src/monl/ir.py src/monl/ir_types.py src/monl/planning.py src/monl/policies.py src/monl/errors.py src/monl/generator/emitters.py --strict

      - name: Recherche de code mort (confiance haute)
        run: vulture src/monl --min-confidence 90

      - name: Suite complète, en mesurant les DEUX paquets
        # `--cov-fail-under=0` lowers no requirement: the gates are drawn from
        # this
        # run at the next step, one per package. Without this 0, the
        # `pyproject.toml`
        # gate would apply to the TOTAL of both packages — a number that means
        # nothing, and would let one package make up for the other.
        #
        # NO `-q` here: `pyproject.toml` already sets one in `addopts`, and two
        # `-q`
        # make `-qq`, which REMOVES the count line and the summary section. A
        # skip
        # then only showed as an `s` lost in a wall of dots — that is how the
        # Pillow
        # skip lived in this CI without anyone reading it. `-rs` NAMES each
        # skipped
        # test with its reason: a skip does not say "nothing to check here", it
        # says
        # "I did not check" (point 140).
        run: >-
          python -m pytest tests/ -rs --cov=src/monl --cov=src/monl_platform
          --cov-report=term-missing --cov-fail-under=0

      - name: Deux barrières à 90 %, tirées de la MÊME exécution
        # The platform was measured on a hand-written LIST OF FILES
        # (`tests/test_platform_*.py tests/test_oauth.py …`). Measured: five
        # files
        # exercised it outside that list, including
        # `tests/test_console_javascript.py`
        # which guards the dead pages of point 163 — their lines did not count
        # in the
        # 90 %, and a test filed under another name would have dropped out
        # without a
        # word (point 169).
        #
        # `coverage report --include=…` rereads the previous step's data: the
        # suite
        # runs ONCE, each package keeps ITS gate, and there is no list left to
        # maintain. The scope stays that of point 63 — `src/monl` and not
        # `src/` —
        # but it is now expressed per package rather than by test selection.
        run: |
          python -m coverage report --include='src/monl/*' --fail-under=90
          python -m coverage report --include='src/monl_platform/*' --fail-under=90

  image:
    name: Image de plateforme
    needs: verifier
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Récupérer le commit testé
        uses: actions/checkout@v4.2.2

      - name: Valider la configuration Compose
        run: docker compose -f compose.platform.yaml config --quiet

      - name: Valider l’exemple de configuration de production
        run: python scripts/check_platform_env.py .env.platform.example

      - name: Construire l'image de production
        run: docker build --file Dockerfile.platform --tag monl-platform:ci .

      - name: Vérifier les modules livrés dans l'image
        run: >-
          docker run --rm --entrypoint python monl-platform:ci
          -c "import monl_platform.app, monl_platform.backup_healthcheck"

      - name: Démarrer l'image et jouer le smoke test
        run: |
          set -euo pipefail
          docker rm --force monl-platform-ci >/dev/null 2>&1 || true
          docker run --detach --name monl-platform-ci \
            --publish 127.0.0.1:18022:8022 monl-platform:ci
          nettoyer() {
            docker logs monl-platform-ci || true
            docker rm --force monl-platform-ci || true
          }
          trap nettoyer EXIT

          pret=false
          for tentative in $(seq 1 60); do
            if curl --fail --silent --show-error \
              --max-time 2 http://127.0.0.1:18022/ready >/dev/null; then
              pret=true
              break
            fi
            sleep 1
          done
          test "$pret" = true
          healthy=false
          for tentative in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' \
              monl-platform-ci)" = healthy ]; then
              healthy=true
              break
            fi
            sleep 1
          done
          test "$healthy" = true
          curl --fail --silent --show-error http://127.0.0.1:18022/health >/dev/null
          test "$(docker inspect --format '{{.Config.User}}' monl-platform-ci)" = monl
