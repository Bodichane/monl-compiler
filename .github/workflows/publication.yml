# Publication sans secret : PyPI échange l'identité OIDC courte de GitHub
# contre un droit d'envoi temporaire.
name: Publication

# Seuls les tags de version déclenchent cette chaîne. Une fusion sur une
# branche ne doit jamais publier comme effet de bord.
on:
  push:
    tags:
      - "v*"

jobs:
  verify-tag:
    name: Vérifier le tag et la version
    runs-on: ubuntu-latest
    # Ce travail lit le dépôt, mais ne publie rien : il n'a donc pas le droit
    # OIDC qui permettrait de demander une identité de publication.
    permissions:
      contents: read
    steps:
      # Version précise : une mise à jour implicite de l'action ne doit pas
      # changer le garde-fou sans revue.
      - name: Récupérer le commit désigné par le tag
        uses: actions/checkout@v4.2.2

      # Version précise, pour que la normalisation soit la même partout.
      - name: Installer la bibliothèque de versions
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Comparer le tag à pyproject.toml
        run: |
          python -m pip install "packaging>=24,<27"
          python scripts/check_publication_version.py "$GITHUB_REF_NAME"

  tests:
    name: Tests et lint avant construction (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # La CI de main ne suffit pas : ce travail éprouve exactement le commit
    # que le tag désigne, avant qu'un artefact ne soit construit.
    #
    # La matrice reprend celle de `ci.yml`, et ce n'est pas du zèle : éprouver
    # le tag sur une SEULE version contredirait la raison d'être de ce travail.
    # Dire « la CI de main ne suffit pas » puis n'en rejouer qu'un tiers, c'est
    # rendre la garantie plus étroite que la phrase qui l'annonce. Un témoin
    # confronte les deux matrices — deux listes de versions tenues séparément
    # finissent toujours par diverger (point 167, sur les classifieurs).
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    permissions:
      contents: read
    steps:
      # Version précise : le code testé doit être celui du tag, pas celui d'un
      # checkout ultérieur.
      - name: Récupérer le commit désigné par le tag
        uses: actions/checkout@v4.2.2

      # Version précise : la matrice et les témoins JavaScript doivent garder
      # un outil connu pendant la publication.
      - name: Installer Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installer Node pour les tests du navigateur
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "20"

      - name: Installer les dépendances de test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Le lint est ici, dans la chaîne de publication, pour que la CI d'une
      # autre exécution ne puisse pas être prise pour la preuve de ce tag.
      - name: Linter avant construction
        run: ruff check src tests

      # Les tests sont aussi ici et doivent réussir avant le job build : une
      # version envoyée ne se réutilise jamais si elle contenait un défaut.
      - name: Suite complète avant construction
        run: python -m pytest tests/ -rs

  build:
    name: Construire une seule fois
    runs-on: ubuntu-latest
    needs: [verify-tag, tests]
    # Ce travail ne publie pas et ne doit pas pouvoir demander un jeton OIDC.
    permissions:
      contents: read
    steps:
      # Version précise : le paquet doit être construit depuis le même commit
      # vérifié et testé.
      - name: Récupérer le commit désigné par le tag
        uses: actions/checkout@v4.2.2

      # Version précise : l'outil de construction est choisi explicitement.
      - name: Installer Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Installer build et twine
        run: python -m pip install --upgrade build twine

      # dist/ peut survivre sur une machine de publication. Le vider avant
      # build empêche un artefact périmé de partir avec la version courante.
      - name: Construire les distributions
        run: |
          rm -rf dist/
          python -m build
          python -m twine check dist/*

      # La construction est faite exactement une fois. Les deux jobs suivants
      # recevront ces mêmes fichiers, au lieu de reconstruire deux fois.
      - name: Conserver les distributions construites
        uses: actions/upload-artifact@v4.6.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publier sur TestPyPI
    runs-on: ubuntu-latest
    needs: build
    # Seul ce travail d'envoi reçoit le pouvoir OIDC, sans secret de dépôt.
    permissions:
      id-token: write
    # Ce nom doit être déclaré comme environnement Trusted Publisher côté
    # TestPyPI ; il isole aussi les règles éventuelles de cet index d'essai.
    environment: testpypi
    steps:
      # Version précise : l'artefact est téléchargé tel quel, sans rebuild.
      - name: Télécharger les distributions
        uses: actions/download-artifact@v4.3.0
        with:
          name: distributions
          path: dist/

      # Version précise. Aucun champ de connexion : l'action fait l'échange
      # OIDC avec TestPyPI et n'utilise aucun secret durable.
      - name: Publier sur TestPyPI par Trusted Publishing
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publier sur PyPI
    runs-on: ubuntu-latest
    # PyPI ne peut arriver qu'après TestPyPI et son job réussi.
    needs: publish-testpypi
    # Cet environnement doit être protégé dans GitHub avec un approbateur
    # requis : poser un tag par erreur ne doit pas envoyer la version pour de
    # bon sans une décision manuelle du mainteneur.
    environment: pypi
    # Seul ce travail final reçoit le pouvoir OIDC ; les tests et le build ne
    # peuvent donc pas l'utiliser s'ils étaient compromis.
    permissions:
      id-token: write
    steps:
      # Version précise : PyPI reçoit les mêmes fichiers que TestPyPI.
      - name: Télécharger les distributions
        uses: actions/download-artifact@v4.3.0
        with:
          name: distributions
          path: dist/

      # Version précise. Le job protégé fait le second envoi par OIDC, sans
      # donnée de connexion durable.
      - name: Publier sur PyPI par Trusted Publishing
        uses: pypa/gh-action-pypi-publish@v1.14.2
