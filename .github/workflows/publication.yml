# Publishing without a secret: PyPI exchanges GitHub's short-lived OIDC
# identity for a temporary upload right.
name: Publication

# Only version tags trigger this chain. A merge on a branch must never
# publish as a side effect.
on:
  push:
    tags:
      - "v*"

jobs:
  verify-tag:
    name: Vérifier le tag et la version
    runs-on: ubuntu-latest
    # This job reads the repository but publishes nothing: so it does not
    # have
    # the OIDC right that would let it ask for a publishing identity.
    permissions:
      contents: read
    steps:
      # Exact version: an implicit update of the action must not change the
      # safeguard without review.
      - name: Récupérer le commit désigné par le tag
        uses: actions/checkout@v4.2.2

      # Exact version, so normalization is the same everywhere.
      - name: Installer la bibliothèque de versions
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Comparer le tag à pyproject.toml
        run: |
          python -m pip install "packaging>=24,<27"
          python scripts/check_publication_version.py "$GITHUB_REF_NAME"

  tests:
    name: Tests et lint avant construction (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # main's CI is not enough: this job exercises exactly the commit the tag
    # points to, before any artifact is built.
    #
    # The matrix repeats `ci.yml`'s, and it is not zeal: exercising the tag on
    # a
    # SINGLE version would contradict this job's reason for being. Saying
    # "main's
    # CI is not enough" and then replaying only a third of it makes the
    # guarantee
    # narrower than the sentence announcing it. A witness compares the two
    # matrices — two version lists kept separately always end up diverging
    # (point 167, on the classifiers).
    #
    # Same reason for the ENVIRONMENT: CI installs `.[dev,postgres]` and mounts
    # a
    # real PostgreSQL. The first run of this chain, on tag v0.9.0-beta.9, only
    # installed `.[dev]`: a test requiring `psycopg` failed on all three
    # versions, and sixteen PostgreSQL tests would have SKIPPED here anyway
    # while
    # they run in CI. A witness now compares extras, service and variable with
    # the same settings in `ci.yml`.
    env:
      MONL_TEST_DATABASE_URL: postgresql://postgres:monl@127.0.0.1:5432/monltest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: monl
          POSTGRES_DB: monltest
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d monltest"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14", "3.15"]
    permissions:
      contents: read
    steps:
      # Exact version: the tested code must be the tag's, not a later
      # checkout's.
      - name: Récupérer le commit désigné par le tag
        uses: actions/checkout@v4.2.2

      # Exact version: the matrix and the JavaScript witnesses must keep a
      # known
      # tool during publication.
      - name: Installer Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installer Node pour les tests du navigateur
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"

      - name: Installer les dépendances de test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres]"

      # Lint is here, in the publishing chain, so that another run's CI
      # cannot be
      # taken as the proof for this tag.
      - name: Linter avant construction
        run: ruff check src tests

      # The tests are also here and must pass before the build job: an
      # uploaded
      # version can never be reused if it contained a defect.
      - name: Suite complète avant construction
        run: python -m pytest tests/ -rs

  build:
    name: Construire une seule fois
    runs-on: ubuntu-latest
    needs: [verify-tag, tests]
    # This job does not publish and must not be able to ask for an OIDC
    # token.
    permissions:
      contents: read
    steps:
      # Exact version: the package must be built from the same checked and
      # tested
      # commit.
      - name: Récupérer le commit désigné par le tag
        uses: actions/checkout@v4.2.2

      # Exact version: the build tool is chosen explicitly.
      - name: Installer Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Installer build et twine
        run: python -m pip install --upgrade build twine

      # dist/ can survive on a publishing machine. Emptying it before build
      # keeps
      # a stale artifact from leaving with the current version.
      - name: Construire les distributions
        run: |
          rm -rf dist/
          python -m build
          python -m twine check dist/*

      # The build happens exactly once. The next two jobs receive these same
      # files
      # instead of building twice.
      - name: Conserver les distributions construites
        uses: actions/upload-artifact@v4.6.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publier sur TestPyPI
    runs-on: ubuntu-latest
    needs: build
    # Only this upload job receives the OIDC power, without a repository
    # secret.
    permissions:
      id-token: write
    # This name must be declared as a Trusted Publisher environment on
    # TestPyPI;
    # it also isolates any rules of that test index.
    environment: testpypi
    steps:
      # Exact version: the artifact is downloaded as is, without
      # rebuilding.
      - name: Télécharger les distributions
        uses: actions/download-artifact@v4.3.0
        with:
          name: distributions
          path: dist/

      # Exact version. No login field: the action performs the OIDC
      # exchange with
      # TestPyPI and uses no long-lived secret.
      - name: Publier sur TestPyPI par Trusted Publishing
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publier sur PyPI
    runs-on: ubuntu-latest
    # PyPI can only come after TestPyPI and its successful job.
    needs: publish-testpypi
    # This environment must be protected in GitHub with a required reviewer:
    # pushing a tag by mistake must not send the version for good without a
    # manual decision by the maintainer.
    environment: pypi
    # Only this final job receives the OIDC power; the tests and the build
    # therefore cannot use it if they were compromised.
    permissions:
      id-token: write
    steps:
      # Exact version: PyPI receives the same files as TestPyPI.
      - name: Télécharger les distributions
        uses: actions/download-artifact@v4.3.0
        with:
          name: distributions
          path: dist/

      # Exact version. The protected job performs the second upload through
      # OIDC,
      # without long-lived login data.
      - name: Publier sur PyPI par Trusted Publishing
        uses: pypa/gh-action-pypi-publish@v1.14.2
