# `restart: always` and NEVER `unless-stopped`: what restarts the containers
# after a machine reboot is `podman-restart.service`, and it runs `podman
# start --all --filter restart-policy=always`. An `unless-stopped` container
# does not match that filter — it stays down indefinitely. Measured on the
# hosting machine: after a reboot, `monl-nginx` (started with `always`) was
# running, the PLATFORM had been `Created` for fifty minutes, and nothing had
# said so. Checked without rebooting, by replaying exactly what boot does:
# container stopped, then `systemctl --user restart podman-restart.service` →
# still `Exited`. The nuance lost by moving to `always` is that a deliberate
# stop does not survive the next machine start. For a production service that
# is the right direction for the error: better to bring back a service one
# wanted off than to leave off a service one wanted to serve.
services:
  platform:
    image: ${MONL_PLATFORM_IMAGE:-monl-platform:local}
    build:
      context: .
      dockerfile: Dockerfile.platform
    restart: always
    init: true
    ports:
      - "127.0.0.1:8022:8022"
    environment:
      MONL_PLATFORM_WORKSPACE: /data
      MONL_PLATFORM_DOMAIN: ${MONL_PLATFORM_DOMAIN:-localhost}
      MONL_PLATFORM_PUBLIC_URL: ${MONL_PLATFORM_PUBLIC_URL:-}
      MONL_PLATFORM_OAUTH_STATE_SECRET: ${MONL_PLATFORM_OAUTH_STATE_SECRET:-}
      MONL_OAUTH_GITHUB_CLIENT_ID: ${MONL_OAUTH_GITHUB_CLIENT_ID:-}
      MONL_OAUTH_GITHUB_SECRET: ${MONL_OAUTH_GITHUB_SECRET:-}
      MONL_OAUTH_GITHUB_BASE_URL: ${MONL_OAUTH_GITHUB_BASE_URL:-}
      MONL_OAUTH_GOOGLE_CLIENT_ID: ${MONL_OAUTH_GOOGLE_CLIENT_ID:-}
      MONL_OAUTH_GOOGLE_SECRET: ${MONL_OAUTH_GOOGLE_SECRET:-}
      MONL_OAUTH_GOOGLE_BASE_URL: ${MONL_OAUTH_GOOGLE_BASE_URL:-}
      # These two go unnoticed when missing: the session cookie travels in
      # clear, and rate limiting counts the whole planet on the proxy's
      # address. See docs/EXPLOITATION.md §1.
      MONL_COOKIE_SECURE: "1"
      MONL_TRUST_PROXY: "1"
      # Written even when they equal the default: an operations setting
      # nobody sees in the compose file is a setting nobody thinks of
      # changing the day it is needed.
      MONL_LOG_LEVEL: INFO
      MONL_PURGE_INTERVAL_SECONDS: "3600"
      MONL_ISOLATE_COMPILES: "1"
      MONL_MAX_CONCURRENT_COMPILES: "2"
      MONL_MAX_RUNNING_SITES: "20"
      MONL_MAX_RUNNING_SITES_PER_ACCOUNT: "3"
      MONL_COMPILE_TIMEOUT_SECONDS: "45"
      MONL_COMPILE_CPU_SECONDS: "30"
      MONL_COMPILE_MEMORY_MB: "768"
      MONL_COMPILE_OUTPUT_MB: "64"
      MONL_PROJECT_RETENTION_DAYS: "30"
    volumes:
      - monl-platform-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  # The backup runs INSIDE the compose file, not in a host cron: a service
  # that deploys with the application cannot be forgotten when it is brought
  # up elsewhere. It uses the same image, hence the same documented command
  # — there are not two ways to back up.
  sauvegarde:
    image: ${MONL_PLATFORM_IMAGE:-monl-platform:local}
    build:
      context: .
      dockerfile: Dockerfile.platform
    restart: always
    init: true
    depends_on:
      platform:
        condition: service_healthy
    # `--garder 14`: without rotation, a daily backup ends up filling the
    # disk, and a full disk stops the service it protected. The backup
    # would then become the outage.
    command:
      - sh
      - -c
      - >
        while true; do
        if ! monl-platform sauvegarde
        "/backups/base-$$(date +%Y%m%d-%H%M%S).sqlite3"
        --workspace /data --garder 14; then
        echo "backup failed, retrying in 60 s" >&2;
        sleep 60;
        continue;
        fi;
        sleep "$${MONL_BACKUP_INTERVAL_SECONDS:-86400}";
        done
    environment:
      MONL_PLATFORM_WORKSPACE: /data
      MONL_BACKUP_INTERVAL_SECONDS: ${MONL_BACKUP_INTERVAL_SECONDS:-86400}
      MONL_BACKUP_MAX_AGE_SECONDS: ${MONL_BACKUP_MAX_AGE_SECONDS:-172800}
    volumes:
      - monl-platform-data:/data
      - monl-platform-backups:/backups
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-m", "monl_platform.backup_healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 2

volumes:
  monl-platform-data:
  # SEPARATE volume, and that is the point: a backup sitting next to the
  # database disappears with it. Taking it off the machine remains the
  # operator's job — see docs/EXPLOITATION.md §5.
  monl-platform-backups:
