<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-labelledby="titre">
  <title id="titre">Monl</title>
  <!-- Le m ramené à ses trois montants et ses deux épaules, en trait carré.
       Le DERNIER fût descend sous la ligne : c'est le l de monl, et la seule
       asymétrie du signe. Elle ne fabrique pas un second objet détaché — le
       défaut de la version précédente, où une barre flottait à côté du m. -->
  <path d="M8 34V11h16v23M24 11h16v31" fill="none" stroke="currentColor"
        stroke-width="4.4" stroke-linecap="butt" stroke-linejoin="miter"/>
</svg>
