<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-labelledby="title desc" font-family="Arial,Helvetica,sans-serif">
  <title id="title">Fonctionnement simple de monl-compiler</title>
  <desc id="desc">L'utilisateur décrit son projet. Une spécification est créée. monl-compiler génère le backend et un contrat utilisé par l'intelligence artificielle pour créer le frontend. La commande monl run vérifie et lance le site.</desc>
  <rect width="1000" height="360" fill="#ffffff"/>

  <text x="500" y="35" text-anchor="middle" font-size="23" font-weight="700" fill="#172033">Comment fonctionne monl-compiler ?</text>
  <text x="500" y="59" text-anchor="middle" font-size="13" fill="#667085">De votre idée à une application vérifiée</text>

  <rect x="35" y="105" width="160" height="92" rx="12" fill="#f5f7fa" stroke="#aeb8c5" stroke-width="1.5"/>
  <circle cx="65" cy="133" r="15" fill="#dff3ef"/>
  <text x="65" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#087f72">1</text>
  <text x="115" y="139" text-anchor="middle" font-size="16" font-weight="700" fill="#172033">Votre idée</text>
  <text x="115" y="166" text-anchor="middle" font-size="12.5" fill="#667085">3 réponses suffisent</text>
  <text x="115" y="184" text-anchor="middle" font-size="12.5" fill="#667085">textes et photos possibles</text>

  <line x1="195" y1="151" x2="235" y2="151" stroke="#667085" stroke-width="2.5"/>
  <polygon points="235,144 247,151 235,158" fill="#667085"/>

  <rect x="247" y="105" width="150" height="92" rx="12" fill="#e7f5f2" stroke="#087f72" stroke-width="1.8"/>
  <circle cx="275" cy="133" r="15" fill="#ccebe5"/>
  <text x="275" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#087f72">2</text>
  <text x="322" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#172033">spec.ml</text>
  <text x="322" y="167" text-anchor="middle" font-size="12.5" fill="#52635f">Données et permissions</text>
  <text x="322" y="185" text-anchor="middle" font-size="12.5" fill="#52635f">une seule source</text>

  <line x1="397" y1="151" x2="437" y2="151" stroke="#667085" stroke-width="2.5"/>
  <polygon points="437,144 449,151 437,158" fill="#667085"/>

  <rect x="449" y="105" width="175" height="92" rx="12" fill="#172033" stroke="#172033" stroke-width="1.5"/>
  <circle cx="478" cy="133" r="15" fill="#2d6b66"/>
  <text x="478" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <text x="552" y="139" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">monl-compiler</text>
  <text x="537" y="167" text-anchor="middle" font-size="12.5" fill="#d2d8e0">Compile et sécurise</text>
  <text x="537" y="185" text-anchor="middle" font-size="12.5" fill="#d2d8e0">sans IA</text>

  <line x1="624" y1="151" x2="664" y2="151" stroke="#667085" stroke-width="2.5"/>
  <polygon points="664,144 676,151 664,158" fill="#667085"/>

  <rect x="676" y="83" width="142" height="72" rx="12" fill="#f5f7fa" stroke="#aeb8c5" stroke-width="1.5"/>
  <text x="747" y="113" text-anchor="middle" font-size="16" font-weight="700" fill="#172033">Backend</text>
  <text x="747" y="136" text-anchor="middle" font-size="12.5" fill="#667085">API · base · comptes</text>

  <rect x="676" y="171" width="142" height="72" rx="12" fill="#f5f1ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="747" y="201" text-anchor="middle" font-size="16" font-weight="700" fill="#172033">Contrat</text>
  <text x="747" y="224" text-anchor="middle" font-size="12.5" fill="#667085">guide du frontend</text>

  <line x1="818" y1="207" x2="852" y2="207" stroke="#8b5cf6" stroke-width="2.5"/>
  <polygon points="852,200 864,207 852,214" fill="#8b5cf6"/>

  <rect x="864" y="171" width="110" height="72" rx="12" fill="#f5f1ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="919" y="201" text-anchor="middle" font-size="15" font-weight="700" fill="#5b35b5">Frontend</text>
  <text x="919" y="224" text-anchor="middle" font-size="12.5" fill="#667085">créé par l'IA</text>

  <line x1="747" y1="243" x2="747" y2="275" stroke="#087f72" stroke-width="2"/>
  <path d="M676 119H650V275H747" fill="none" stroke="#087f72" stroke-width="2"/>
  <line x1="919" y1="243" x2="919" y2="275" stroke="#087f72" stroke-width="2"/>
  <line x1="747" y1="275" x2="919" y2="275" stroke="#087f72" stroke-width="2"/>
  <line x1="833" y1="275" x2="833" y2="291" stroke="#087f72" stroke-width="2.5"/>
  <polygon points="826,291 833,303 840,291" fill="#087f72"/>

  <rect x="676" y="303" width="298" height="42" rx="10" fill="#ffffff" stroke="#087f72" stroke-width="2"/>
  <text x="825" y="329" text-anchor="middle" font-size="14" font-weight="700" fill="#087f72">monl run vérifie puis lance l'application</text>

  <text x="35" y="330" font-size="12" font-weight="700" fill="#087f72">Vert et noir : produits par le compilateur</text>
  <text x="35" y="349" font-size="12" fill="#6f6289">Violet : interface créée par l'IA</text>
</svg>
