<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 360" width="1020" height="360" role="img" aria-labelledby="title desc" font-family="Arial,Helvetica,sans-serif">
  <title id="title">What monl-compiler produces</title>
  <desc id="desc">From the user’s description, monl-compiler produces the specification, backend and frontend contract. AI then uses the contract to create the interface. The monl run command checks the backend and frontend before launch.</desc>
  <rect width="1020" height="360" fill="#ffffff"/>

  <!--
    Grid. Columns : A 30–190 · B 224–404 · C 438–596 · D 630–788 · E 822–990
    (34 px between columns, 30 px margins). Deliverable rows:
    88–150 · 158–220 · 228–290, centers 119 · 189 · 259. The main flow
    follows the middle row (y = 189); each arrow is straight.
  -->

  <text x="510" y="33" text-anchor="middle" font-size="23" font-weight="700" fill="#000000">What monl-compiler produces</text>
  <text x="510" y="56" text-anchor="middle" font-size="13" fill="#000000">A simple description becomes a complete, checked application</text>

  <!-- A · Your project (143–235, center 189) -->
  <rect x="30" y="143" width="160" height="92" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="110" y="176" text-anchor="middle" font-size="17" font-weight="700" fill="#000000">Your project</text>
  <text x="110" y="202" text-anchor="middle" font-size="12.5" fill="#000000">type · name · description</text>
  <text x="110" y="221" text-anchor="middle" font-size="12.5" fill="#000000">text and photos</text>

  <line x1="190" y1="189" x2="212" y2="189" stroke="#000000" stroke-width="2"/>
  <polygon points="212,182 224,189 212,196" fill="#000000"/>

  <!-- B · monl-compiler (131–247, center 189), emphasized outline -->
  <rect x="224" y="131" width="180" height="116" rx="12" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <text x="314" y="171" text-anchor="middle" font-size="19" font-weight="700" fill="#000000">monl-compiler</text>
  <text x="314" y="200" text-anchor="middle" font-size="13" fill="#000000">guided dialogue</text>
  <text x="314" y="221" text-anchor="middle" font-size="13" fill="#000000">compilation · security</text>

  <line x1="404" y1="189" x2="426" y2="189" stroke="#000000" stroke-width="2"/>
  <polygon points="426,182 438,189 426,196" fill="#000000"/>

  <!-- C · the three deliverables -->
  <text x="517" y="74" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#000000">3 DELIVERABLES</text>

  <rect x="438" y="88" width="158" height="62" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="517" y="116" text-anchor="middle" font-size="17" font-weight="700" fill="#000000">spec.ml</text>
  <text x="517" y="136" text-anchor="middle" font-size="12" fill="#000000">source of truth</text>

  <rect x="438" y="158" width="158" height="62" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="517" y="186" text-anchor="middle" font-size="17" font-weight="700" fill="#000000">Backend</text>
  <text x="517" y="206" text-anchor="middle" font-size="12" fill="#000000">API · database · accounts</text>

  <rect x="438" y="228" width="158" height="62" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="517" y="256" text-anchor="middle" font-size="17" font-weight="700" fill="#000000">Frontend contract</text>
  <text x="517" y="276" text-anchor="middle" font-size="12" fill="#000000">interface guide</text>

  <!-- Backend → monl run : crosses the empty row in column D -->
  <line x1="596" y1="189" x2="810" y2="189" stroke="#000000" stroke-width="2"/>
  <polygon points="810,182 822,189 810,196" fill="#000000"/>

  <!-- Contract → Frontend: dashed, the only nondeterministic link -->
  <line x1="596" y1="259" x2="618" y2="259" stroke="#000000" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="618,252 630,259 618,266" fill="#000000"/>

  <!-- D · Frontend, same row and size as the contract -->
  <rect x="630" y="228" width="158" height="62" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="709" y="256" text-anchor="middle" font-size="17" font-weight="700" fill="#000000">Frontend</text>
  <text x="709" y="276" text-anchor="middle" font-size="12" fill="#000000">created by AI</text>

  <!-- Frontend → monl run -->
  <line x1="788" y1="259" x2="810" y2="259" stroke="#000000" stroke-width="2"/>
  <polygon points="810,252 822,259 810,266" fill="#000000"/>

  <!-- E · monl run, spans the Backend and Frontend rows (158–290) -->
  <rect x="822" y="158" width="168" height="132" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="906" y="218" text-anchor="middle" font-size="17" font-weight="700" fill="#000000">monl run</text>
  <text x="906" y="240" text-anchor="middle" font-size="12.5" fill="#000000">checks and launches</text>

  <!-- legend, aligned with column A -->
  <line x1="30" y1="318" x2="58" y2="318" stroke="#000000" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="66" y="322" font-size="11.5" fill="#000000">dashed = written by AI</text>
  <text x="30" y="344" font-size="12" font-weight="700" fill="#000000">Deterministic backend · AI limited to frontend</text>
</svg>
