<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 360" width="1020" height="360" role="img" aria-labelledby="title desc" font-family="Arial,Helvetica,sans-serif">
  <title id="title">Ce que produit monl-compiler</title>
  <desc id="desc">À partir de la description de l'utilisateur, monl-compiler produit la spécification, le backend et le contrat frontend. Une intelligence artificielle utilise ensuite le contrat pour créer l'interface. La commande monl run vérifie le backend et le frontend avant lancement.</desc>
  <rect width="1020" height="360" fill="#ffffff"/>

  <!--
    Grille. Colonnes : A 30–190 · B 224–404 · C 438–596 · D 630–788 · E 822–990
    (34 px entre deux colonnes, marges de 30 px). Rangées des livrables :
    88–150 · 158–220 · 228–290, centres 119 · 189 · 259. Le flux principal
    suit la rangée du milieu (y = 189) ; chaque flèche est droite.
  -->

  <text x="510" y="33" text-anchor="middle" font-size="23" font-weight="700" fill="#000000">Ce que produit monl-compiler</text>
  <text x="510" y="56" text-anchor="middle" font-size="13" fill="#000000">Une description simple devient une application complète et vérifiée</text>

  <!-- A · Votre projet (143–235, centre 189) -->
  <rect x="30" y="143" width="160" height="92" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="110" y="176" text-anchor="middle" font-size="17" font-weight="700" fill="#000000">Votre projet</text>
  <text x="110" y="202" text-anchor="middle" font-size="12.5" fill="#000000">type · nom · description</text>
  <text x="110" y="221" text-anchor="middle" font-size="12.5" fill="#000000">textes et photos</text>

  <line x1="190" y1="189" x2="212" y2="189" stroke="#000000" stroke-width="2"/>
  <polygon points="212,182 224,189 212,196" fill="#000000"/>

  <!-- B · monl-compiler (131–247, centre 189), contour accentué -->
  <rect x="224" y="131" width="180" height="116" rx="12" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <text x="314" y="171" text-anchor="middle" font-size="19" font-weight="700" fill="#000000">monl-compiler</text>
  <text x="314" y="200" text-anchor="middle" font-size="13" fill="#000000">dialogue guidé</text>
  <text x="314" y="221" text-anchor="middle" font-size="13" fill="#000000">compilation · sécurité</text>

  <line x1="404" y1="189" x2="426" y2="189" stroke="#000000" stroke-width="2"/>
  <polygon points="426,182 438,189 426,196" fill="#000000"/>

  <!-- C · les trois livrables -->
  <text x="517" y="74" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#000000">3 LIVRABLES</text>

  <rect x="438" y="88" width="158" height="62" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="517" y="116" text-anchor="middle" font-size="17" font-weight="700" fill="#000000">spec.ml</text>
  <text x="517" y="136" text-anchor="middle" font-size="12" fill="#000000">source de vérité</text>

  <rect x="438" y="158" width="158" height="62" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="517" y="186" text-anchor="middle" font-size="17" font-weight="700" fill="#000000">Backend</text>
  <text x="517" y="206" text-anchor="middle" font-size="12" fill="#000000">API · base · comptes</text>

  <rect x="438" y="228" width="158" height="62" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="517" y="256" text-anchor="middle" font-size="17" font-weight="700" fill="#000000">Contrat frontend</text>
  <text x="517" y="276" text-anchor="middle" font-size="12" fill="#000000">guide de l'interface</text>

  <!-- Backend → monl run : traverse la rangée vide de la colonne D -->
  <line x1="596" y1="189" x2="810" y2="189" stroke="#000000" stroke-width="2"/>
  <polygon points="810,182 822,189 810,196" fill="#000000"/>

  <!-- Contrat → Frontend : pointillés, le seul lien non déterministe -->
  <line x1="596" y1="259" x2="618" y2="259" stroke="#000000" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="618,252 630,259 618,266" fill="#000000"/>

  <!-- D · Frontend, même rangée et même taille que le contrat -->
  <rect x="630" y="228" width="158" height="62" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="709" y="256" text-anchor="middle" font-size="17" font-weight="700" fill="#000000">Frontend</text>
  <text x="709" y="276" text-anchor="middle" font-size="12" fill="#000000">créé par l'IA</text>

  <!-- Frontend → monl run -->
  <line x1="788" y1="259" x2="810" y2="259" stroke="#000000" stroke-width="2"/>
  <polygon points="810,252 822,259 810,266" fill="#000000"/>

  <!-- E · monl run, couvre les rangées Backend et Frontend (158–290) -->
  <rect x="822" y="158" width="168" height="132" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="906" y="218" text-anchor="middle" font-size="17" font-weight="700" fill="#000000">monl run</text>
  <text x="906" y="240" text-anchor="middle" font-size="12.5" fill="#000000">vérifie et lance</text>

  <!-- légende, alignée sur la colonne A -->
  <line x1="30" y1="318" x2="58" y2="318" stroke="#000000" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="66" y="322" font-size="11.5" fill="#000000">pointillés = écrit par l'IA</text>
  <text x="30" y="344" font-size="12" font-weight="700" fill="#000000">Backend déterministe · IA limitée au frontend</text>
</svg>
