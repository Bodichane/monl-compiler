app TodoApp

entity User
    name: String
    email: Email

entity Todo
    title: String
    completed: Boolean

relation User hasMany Todo

actor User
actor Admin

rule Todo.title required
rule User.email unique
rule User.email restrictedTo Admin

workflow ManageTodo for User
    Create Todo
    Read Todo
    Update Todo
    Execute autoArchiveTodo

workflow AdminTodo for Admin
    Delete Todo

custom autoArchiveTodo
    input: Todo.title
    output: status: String
    description: "Analyse le titre et archive automatiquement si le mot clé [Archive] est detecté"
