app AnonSocialNetwork

entity Member
    name: String
    reputation: Integer

entity Post
    content: Text
    author: String
    # champ cible des règles 'increments' et 'categorized' plus bas
    likes: Integer
    dislikes: Integer

entity Report
    reason: String

entity Like
    note: String

entity Dislike
    note: String

entity Comment
    content: Text
    # champ normal (pas une relation) : quel post ce commentaire cible --
    # un choix du client, pas "ce commentaire m'appartient", donc pas de
    # relation dédiée (limite de conception : une seule relation entrante
    # auto-peuplée par entité pour l'instant, voir _get_incoming_relation).
    post_id: Integer

relation Member hasMany Report
relation Post hasMany Like
relation Post hasMany Dislike
relation Member hasMany Comment

actor Member

capability auth

# Les posts sont publics, et leur auteur est un pseudonyme anonyme stable
# généré par le serveur -- jamais fourni ni contrôlable par le client.
rule Post.Read public
rule Post.author generated

# Les likes s'affichent en catégories plutôt qu'en nombre exact (brique 5).
rule Post.likes categorized: "peu" below 10, "populaire" below 100, "viral" otherwise

# Un like fait monter le compteur de likes du post ciblé (brique 4).
rule Like.Create increments Post.likes by 5

# Un dislike fait monter le compteur de dislikes du post ciblé (symétrique
# de 'Like', même mécanisme -- 'increments' ne connaît pas le sens du
# champ qu'il incrémente, seulement qu'il monte).
rule Dislike.Create increments Post.dislikes by 1

# Un signalement fait baisser la réputation du membre signalé (brique 3).
rule Report.Create decrements Member.reputation by 10

# Les commentaires sont publics en lecture, mais seul leur auteur peut
# les modifier ou les supprimer (contrôle d'accès par propriété).
rule Comment.Read public
rule Comment.Update ownedBy Member
rule Comment.Delete ownedBy Member

workflow ManageMember for Member
    Create Member

workflow ManagePost for Member
    Create Post
    Read Post

workflow ReportMember for Member
    Create Report

workflow LikePost for Member
    Create Like

workflow DislikePost for Member
    Create Dislike

workflow ManageComment for Member
    Create Comment
    Read Comment
    # seul le propriétaire peut passer par ici, voir 'ownedBy' plus haut
    Update Comment
    Delete Comment

landing
    mode: ai
    brief: "Un réseau social où les posts sont publics mais l'auteur reste anonyme, la réputation baisse en cas de signalement, et les likes s'affichent en catégories."
