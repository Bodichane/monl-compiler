[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monl-compiler"
version = "0.9.0-beta.8"
description = "Compilateur d'intention logicielle : dialogue dirigé (sans IA) → spec DSL déterministe → backend FastAPI sécurisé + contrat frontend."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "FSL-1.1-ALv2" }
authors = [{ name = "monl-compiler" }]
keywords = ["dsl", "compiler", "fastapi", "codegen", "low-code"]

# Dépendances épinglées avec bornes hautes pour la reproductibilité de la bêta
# (voir aussi requirements.txt, gardé synchronisé pour l'usage sans packaging).
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.29,<1.0",
    "lark>=1.1,<2.0",
    "PyJWT>=2.8,<3.0",
    "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
ai = [
    "requests>=2.31,<3.0",
    "Pillow>=10.0,<13.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0",       # ce que les tests ne touchent pas
    "ruff>=0.6",             # fautes, imports morts, tri des imports
    "mypy>=1.10,<2.0",       # contrats typés aux frontières de l'IR
    "vulture>=2.11,<3.0",    # recherche de code mort, revue manuelle conservée
    "requests>=2.31,<3.0",   # tests HTTP et fournisseurs frontend
    # Pillow ne vivait que dans l'extra `ai`, que la CI n'installe pas. Deux
    # conséquences, toutes deux du point 140 : le test de réencodage JPEG
    # SAUTAIT en silence (un saut ne dit pas « rien à vérifier », il dit « je
    # n'ai pas vérifié »), et le test qui garde les images de marque échouait
    # franchement. Les tests ont besoin de la bibliothèque : elle est donc
    # déclarée là où les tests s'installent.
    "Pillow>=10.0,<13.0",
    # `tomllib` n'entre dans la bibliothèque standard qu'en 3.11, et le dépôt
    # supporte 3.10 : test_architecture.py lit `per-file-ignores` pour vérifier
    # qu'aucune exception de ruff ne vise un fichier disparu. SAUTER ce test
    # sur 3.10 le rendrait muet là où il sert le plus (point 140).
    "tomli>=2.0; python_version < '3.11'",
]
postgres = [
    "psycopg>=3.1,<4.0",
]

[project.scripts]
monl = "monl.cli:main"
monl-platform = "monl_platform.__main__:main"
monl-mcp = "monl_platform.mcp_server:main"

# POINT 65 : vrai paquet Python. La « structure src plat » de la bêta
# n'était installable qu'à travers un shim qui manipulait sys.path ; le code
# vit désormais dans src/monl/ et s'importe comme n'importe quelle
# bibliothèque — y compris depuis les tests, qui n'ont plus d'incantation en
# tête de fichier.
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
monl_platform = ["static/*.png", "static/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# ─────────────────────────────────────────────────────────────────────
# Ruff — le linter. Jeu de règles CHOISI, pas le catalogue complet : un
# linter qui crie sur du code délibéré finit ignoré, et un avertissement
# ignoré ne vaut pas mieux que pas d'avertissement (même raisonnement
# qu'au point 48 pour les clauses du contrat).
# ─────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # Le dépôt écrit en français : « é », « — », « … » ne sont pas des
    # caractères ambigus à corriger, ce sont la langue du projet.
    "RUF001", "RUF002", "RUF003",
    # Longues chaînes de brief et de grammaire : couper à 100 colonnes
    # nuirait à la relecture de ce qui compte le plus.
    "E501",
    # Style assumé du dépôt, pas des défauts :
    "E701",    # « with open(...) as f: f.write(x) » — compact et lisible
    "RUF005",  # « liste + [x] » se lit mieux que le dépaquetage ici
    "RUF012",  # attributs de classe exigés par l'API Lark (MonlIndenter)
    "SIM105",  # contextlib.suppress cache le motif au profit d'un import
    "SIM115",  # fichiers ouverts sans gestionnaire dans les tests, à dessein
    "B007",    # variable de boucle inutilisée : lisible quand elle nomme
    "RUF059",  # dépaquetage partiel : les noms documentent la forme
]

[tool.ruff.lint.per-file-ignores]
# La grammaire Lark vit dans une chaîne littérale : ses lignes vides
# PORTENT des espaces, et y toucher modifierait le texte que Lark analyse.
# Le linter voit des lignes physiques, pas la frontière du littéral.
"src/monl/parser/grammaire.py" = ["W293"]
# (L'exception E402 de frontend_ai.py est TOMBÉE avec son fichier : le paquet
# range les imports de chaque section dans l'en-tête de son propre module,
# donc il n'y a plus rien à excuser. Un chemin qui n'existe plus n'excuse
# rien non plus — il fait juste croire qu'une règle est encore assouplie.)
# Trois sections successives dans un même fichier (voie API, voie import,
# voie Claude Code), chacune avec ses imports : c'est la lecture du fichier
# qui commande, pas la convention.
"tests/test_smoke_and_frontend_ai.py" = ["E402"]
# Le test construit le code d'un SOUS-PROCESSUS : « %r » y sert à citer des
# chemins sans risque de guillemets, pas à formater un affichage.
"tests/test_beta3_regressions.py" = ["UP031"]

[tool.coverage.run]
source = ["src/monl"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
