[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "monl-compiler"
version = "1.0.1"
description = "Compilateur d'intention logicielle : dialogue dirigé (sans IA) → spec DSL déterministe → backend FastAPI sécurisé + contrat frontend."
readme = "README.md"
requires-python = ">=3.10"
# FSL-1.1-ALv2 is not a listed SPDX identifier: `LicenseRef-` is the PEP 639
# form meant to name a custom license without replacing it with Apache or
# another SPDX license. The file of record also travels in every artifact.
license = "LicenseRef-FSL-1.1-ALv2"
license-files = ["LICENSE"]
# Value confirmed by the maintainer, aligned with `legal.EDITEUR`.
authors = [{ name = "Itchane Bodi" }]
keywords = ["dsl", "compiler", "fastapi", "codegen", "low-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Compilers",
]

# Dependencies pinned with upper bounds for the beta's reproducibility (see
# also requirements.txt, kept in sync for use without packaging).
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.29,<1.0",
    "lark>=1.1,<2.0",
    "PyJWT>=2.8,<3.0",
    "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
ai = [
    "requests>=2.31,<3.0",
    "Pillow>=10.0,<13.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0",       # ce que les tests ne touchent pas
    "ruff>=0.6",             # fautes, imports morts, tri des imports
    "mypy>=1.10,<2.0",       # contrats typés aux frontières de l'IR
    "vulture>=2.11,<3.0",    # recherche de code mort, revue manuelle conservée
    "requests>=2.31,<3.0",   # tests HTTP et fournisseurs frontend
    "packaging>=24,<27",      # normalisation officielle du tag de publication
    "PyYAML>=6.0,<7.0",       # parsing local du workflow de publication dans ses témoins
    # Pillow only lived in the `ai` extra, which CI does not install. Two
    # consequences, both from point 140: the JPEG re-encoding test SKIPPED
    # silently (a skip does not say "nothing to check", it says "I did not
    # check"), and the test guarding the brand images failed outright. The
    # tests
    # need the library: so it is declared where the tests get installed.
    "Pillow>=10.0,<13.0",
    # `tomllib` only enters the standard library in 3.11, and the repository
    # supports 3.10: test_architecture.py reads `per-file-ignores` to check
    # that
    # no ruff exception targets a vanished file. SKIPPING that test on 3.10
    # would
    # silence it where it matters most (point 140).
    "tomli>=2.0; python_version < '3.11'",
]
postgres = [
    "psycopg[pool]>=3.1,<4.0",
]

[project.urls]
Repository = "https://github.com/Bodichane/monl-compiler"
Documentation = "https://github.com/Bodichane/monl-compiler/tree/main/docs"
Issues = "https://github.com/Bodichane/monl-compiler/issues"

[project.scripts]
monl = "monl.cli:main"
monl-platform = "monl_platform.__main__:main"
monl-mcp = "monl_platform.mcp_server:main"

# POINT 65: a real Python package. The beta's "flat src layout" was only
# installable through a shim that manipulated sys.path; the code now lives
# in
# src/monl/ and is imported like any library — including from the tests,
# which no longer carry an incantation at the top of the file.
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
monl_platform = ["static/*.png", "static/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# A resource (SQLite connection, file, subprocess pipe, HTTP response) left
# to the garbage collector is a defect, not noise: 72 `unclosed database`
# under Python 3.14 came from `with sqlite3.connect(...)`, which commits
# without closing (points 141 and 185), and the same widened filter then
# found five files never closed in `frontend_ai`. The second filter covers
# the same warning raised in a destructor, which pytest relays under that
# name.
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

# ─────────────────────────────────────────────────────────────────────
# Ruff — the linter. A CHOSEN rule set, not the full catalog: a linter
# that
# shouts at deliberate code ends up ignored, and an ignored warning is
# worth
# no more than no warning (same reasoning as point 48 for the contract's
# clauses).
# ─────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # « — », « … », typographic quotes and accented letters are
    # deliberate: the
    # design journal stays in French, and generated-file markers are
    # French on
    # purpose. They are not ambiguous characters to fix.
    "RUF001", "RUF002", "RUF003",
    # Long brief and grammar strings: wrapping at 100 columns would
    # hurt the
    # reading of what matters most.
    "E501",
    # The repository's assumed style, not defects:
    "E701",    # « with open(...) as f: f.write(x) » — compact et lisible
    "RUF005",  # « liste + [x] » se lit mieux que le dépaquetage ici
    "RUF012",  # attributs de classe exigés par l'API Lark (MonlIndenter)
    "SIM105",  # contextlib.suppress cache le motif au profit d'un import
    "SIM115",  # fichiers ouverts sans gestionnaire dans les tests, à dessein
    "B007",    # variable de boucle inutilisée : lisible quand elle nomme
    "RUF059",  # dépaquetage partiel : les noms documentent la forme
]

[tool.ruff.lint.per-file-ignores]
# The Lark grammar lives in a string literal: its blank lines CARRY
# spaces,
# and touching them would change the text Lark parses. The linter sees
# physical lines, not the boundary of the literal.
"src/monl/parser/grammaire.py" = ["W293"]
# (The E402 exception for frontend_ai.py FELL with its file: the package
# keeps
# each section's imports in the header of its own module, so there is nothing
# left to excuse. A path that no longer exists excuses nothing either — it
# only makes people believe a rule is still relaxed.)
# Three successive sections in one file (API path, import path, Claude Code
# path), each with its imports: the reading of the file decides, not the
# convention.
"tests/test_smoke_and_frontend_ai.py" = ["E402"]
# The test builds the code of a SUBPROCESS: "%r" quotes paths there without
# any quoting risk, it does not format a display.
"tests/test_beta3_regressions.py" = ["UP031"]

[tool.coverage.run]
source = ["src/monl"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
