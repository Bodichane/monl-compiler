<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnonSocialNetwork</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #F3EFE1; --surface: #FFFFFF; --ink: #241F16;
    --accent: #2F5D49; --accent2: #B23C3A; --radius: 4.4px;
    --font-display: 'Fraunces', Georgia, serif; --font-body: 'Inter', -apple-system, sans-serif;
    --line: color-mix(in srgb, var(--ink) 12%, transparent);
    --muted: color-mix(in srgb, var(--ink) 60%, transparent);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); }
header {
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.9rem 1.2rem;
}
header .brand { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; }
header .brand a { color: inherit; text-decoration: none; }
#logoutBtn {
    background: none; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 0.4rem 0.9rem; font-family: inherit; color: var(--ink); cursor: pointer;
}
#logoutBtn:hover { background: var(--surface); }

main { max-width: 600px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }

.composer {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 1rem; margin-bottom: 1.5rem;
}
.composer textarea {
    width: 100%; border: none; background: transparent; font-family: inherit;
    font-size: 1.05rem; resize: vertical; min-height: 3.2rem; color: var(--ink);
}
.composer textarea:focus { outline: none; }
.composer-footer { display: flex; justify-content: flex-end; margin-top: 0.5rem; }
.btn-primary {
    background: var(--accent); color: var(--surface); border: none; border-radius: var(--radius);
    padding: 0.55rem 1.4rem; font-family: inherit; font-weight: 600; cursor: pointer; font-size: 0.95rem;
}
.btn-primary:hover { opacity: 0.92; }
.btn-primary:disabled { opacity: 0.5; cursor: default; }

.post {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 1rem 1.1rem; margin-bottom: 1rem;
}
.post-head { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.6rem; }
.avatar {
    width: 38px; height: 38px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    color: var(--surface); font-weight: 600; font-size: 0.95rem; font-family: var(--font-display);
}
.author { font-weight: 600; font-size: 0.92rem; }
.post-content { font-size: 1rem; line-height: 1.45; white-space: pre-wrap; margin-bottom: 0.7rem; }

.actions { display: flex; gap: 1.6rem; border-top: 1px solid var(--line); padding-top: 0.6rem; }
.action-btn {
    background: none; border: none; cursor: pointer; font-family: inherit;
    display: flex; align-items: center; gap: 0.35rem; color: var(--muted);
    font-size: 0.9rem; padding: 0.2rem 0.3rem; border-radius: var(--radius);
}
.action-btn:hover { background: var(--bg); }
.action-btn .icon { font-size: 1.05rem; }
.action-btn.like:hover, .action-btn.like.active { color: var(--accent); }
.action-btn.dislike:hover, .action-btn.dislike.active { color: var(--accent2); }
.action-btn.comment:hover { color: var(--ink); }

.comments { margin-top: 0.7rem; border-top: 1px solid var(--line); padding-top: 0.7rem; display: none; }
.comments.open { display: block; }
.comment-item { display: flex; gap: 0.5rem; margin-bottom: 0.6rem; align-items: flex-start; }
.comment-item .avatar { width: 26px; height: 26px; font-size: 0.7rem; }
.comment-body { background: var(--bg); border-radius: var(--radius); padding: 0.45rem 0.7rem; font-size: 0.88rem; flex: 1; }
.comment-empty { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.6rem; }
.comment-form { display: flex; gap: 0.5rem; }
.comment-form input {
    flex: 1; font-family: inherit; font-size: 0.88rem; padding: 0.45rem 0.6rem;
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); color: var(--ink);
}
.comment-form button {
    background: var(--accent); color: var(--surface); border: none; border-radius: var(--radius);
    padding: 0.45rem 0.9rem; font-family: inherit; font-size: 0.85rem; cursor: pointer;
}

.empty-state { text-align: center; color: var(--muted); padding: 3rem 1rem; }
.status-msg { text-align: center; color: var(--muted); font-size: 0.85rem; margin-bottom: 1rem; min-height: 1.2rem; }
</style>
</head>
<body>

<header>
    <div class="brand"><a href="/">AnonSocialNetwork</a></div>
    <button type="button" id="logoutBtn">Se déconnecter</button>
</header>

<main>
    <div class="composer">
        <textarea id="composerText" placeholder="Quoi de neuf ?"></textarea>
        <div class="composer-footer">
            <button type="button" class="btn-primary" id="publishBtn">Publier</button>
        </div>
    </div>

    <div class="status-msg" id="statusMsg"></div>
    <div id="feed"></div>
</main>

<script>
(function () {
    var token = null;
    try { token = sessionStorage.getItem('monlang_token'); } catch (err) { token = null; }
    if (!token) { window.location.href = '/'; return; }

    function apiFetch(url, opts) {
        opts = opts || {};
        return fetch(url, opts).then(function (res) {
            if (res.status === 401) {
                try { sessionStorage.removeItem('monlang_token'); } catch (err) {}
                window.location.href = '/?session_expired=1';
                throw new Error('session expired');
            }
            return res;
        });
    }

    function authHeaders(extra) {
        return Object.assign({ 'Authorization': 'Bearer ' + token }, extra || {});
    }

    document.getElementById('logoutBtn').addEventListener('click', function () {
        apiFetch('/logout', { method: 'POST', headers: authHeaders() }).finally(function () {
            try { sessionStorage.removeItem('monlang_token'); } catch (err) {}
            window.location.href = '/';
        });
    });

    // Pseudonyme -> couleur d'avatar stable (dérivée du handle, pas de la
    // vraie identité -- juste pour distinguer visuellement des auteurs
    // différents dans le flux).
    var AVATAR_PALETTE = ['#2F5D49', '#B23C3A', '#8C6D1F', '#3B5B8C', '#6B4C8C', '#1F7A6C'];
    function avatarColor(handle) {
        var sum = 0;
        for (var i = 0; i < handle.length; i++) sum += handle.charCodeAt(i);
        return AVATAR_PALETTE[sum % AVATAR_PALETTE.length];
    }
    function avatarInitial(handle) {
        var m = handle.match(/\d/);
        return m ? m[0] : 'A';
    }
    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    var commentsByPost = {};
    var openComments = {};

    function loadComments() {
        return apiFetch('/comment?limit=200', { headers: authHeaders() })
            .then(function (res) { return res.json(); })
            .then(function (body) {
                commentsByPost = {};
                (body.data || []).forEach(function (c) {
                    (commentsByPost[c.post_id] = commentsByPost[c.post_id] || []).push(c);
                });
            });
    }

    function renderComments(postId) {
        var list = commentsByPost[postId] || [];
        if (!list.length) return '<div class="comment-empty">Aucun commentaire pour l\'instant.</div>';
        return list.map(function (c) {
            return '<div class="comment-item">' +
                '<div class="avatar" style="background:' + avatarColor('M' + c.member_id) + '">M</div>' +
                '<div class="comment-body">' + escapeHtml(c.content) + '</div>' +
                '</div>';
        }).join('');
    }

    function updateCard(cardEl, post) {
        cardEl.querySelector('.like-label').textContent = post.likes_category || '';
        cardEl.querySelector('.dislike-label').textContent = post.dislikes != null ? post.dislikes : '';
        var count = (commentsByPost[post.id] || []).length;
        cardEl.querySelector('.comment-label').textContent = count || '';
    }

    function refreshOnePost(postId, cardEl) {
        apiFetch('/post/' + postId, { headers: authHeaders() })
            .then(function (res) { return res.json(); })
            .then(function (body) { updateCard(cardEl, body.data); });
    }

    function renderFeed(posts) {
        var feedEl = document.getElementById('feed');
        feedEl.innerHTML = '';
        if (!posts.length) {
            feedEl.innerHTML = '<div class="empty-state">Aucun post pour l\'instant — sois le premier à publier.</div>';
            return;
        }
        posts.slice().reverse().forEach(function (post) {
            var color = avatarColor(post.author || 'Anon');
            var card = document.createElement('div');
            card.className = 'post';
            card.dataset.postId = post.id;
            card.innerHTML =
                '<div class="post-head">' +
                    '<div class="avatar" style="background:' + color + '">' + avatarInitial(post.author || 'A') + '</div>' +
                    '<div class="author">' + escapeHtml(post.author || 'Anonyme') + '</div>' +
                '</div>' +
                '<div class="post-content">' + escapeHtml(post.content) + '</div>' +
                '<div class="actions">' +
                    '<button type="button" class="action-btn like"><span class="icon">❤</span><span class="like-label">' + (post.likes_category || '') + '</span></button>' +
                    '<button type="button" class="action-btn dislike"><span class="icon">👎</span><span class="dislike-label">' + (post.dislikes != null ? post.dislikes : '') + '</span></button>' +
                    '<button type="button" class="action-btn comment"><span class="icon">💬</span><span class="comment-label">' + ((commentsByPost[post.id] || []).length || '') + '</span></button>' +
                '</div>' +
                '<div class="comments" id="comments-' + post.id + '">' +
                    '<div class="comment-list">' + renderComments(post.id) + '</div>' +
                    '<form class="comment-form">' +
                        '<input type="text" placeholder="Ajouter un commentaire…" maxlength="500">' +
                        '<button type="submit">Envoyer</button>' +
                    '</form>' +
                '</div>';
            feedEl.appendChild(card);

            card.querySelector('.like').addEventListener('click', function () {
                apiFetch('/like', {
                    method: 'POST', headers: authHeaders({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify({ note: '', post_id: post.id })
                }).then(function () { refreshOnePost(post.id, card); });
            });
            card.querySelector('.dislike').addEventListener('click', function () {
                apiFetch('/dislike', {
                    method: 'POST', headers: authHeaders({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify({ note: '', post_id: post.id })
                }).then(function () { refreshOnePost(post.id, card); });
            });
            var commentsPanel = card.querySelector('.comments');
            card.querySelector('.comment').addEventListener('click', function () {
                openComments[post.id] = !openComments[post.id];
                commentsPanel.classList.toggle('open', openComments[post.id]);
            });
            card.querySelector('.comment-form').addEventListener('submit', function (ev) {
                ev.preventDefault();
                var input = card.querySelector('.comment-form input');
                var text = input.value.trim();
                if (!text) return;
                apiFetch('/comment', {
                    method: 'POST', headers: authHeaders({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify({ content: text, post_id: post.id })
                }).then(function () {
                    input.value = '';
                    return loadComments();
                }).then(function () {
                    card.querySelector('.comment-list').innerHTML = renderComments(post.id);
                    // Ne PAS appeler updateCard(card, post) ici : 'post' est
                    // l'objet capturé au rendu initial du flux -- ré-écrire
                    // les labels like/dislike depuis cette fermeture périmée
                    // écraserait un like/dislike entre-temps avec sa valeur
                    // d'origine. Seul le compteur de commentaires (dérivé de
                    // 'commentsByPost', rechargé juste au-dessus) est à jour.
                    var count = (commentsByPost[post.id] || []).length;
                    card.querySelector('.comment-label').textContent = count || '';
                });
            });
        });
    }

    function loadFeed() {
        Promise.all([
            apiFetch('/post?limit=50', { headers: authHeaders() }).then(function (r) { return r.json(); }),
            loadComments()
        ]).then(function (results) {
            renderFeed(results[0].data || []);
        }).catch(function (err) { console.error(err); });
    }

    document.getElementById('publishBtn').addEventListener('click', function () {
        var textarea = document.getElementById('composerText');
        var text = textarea.value.trim();
        if (!text) return;
        var btn = document.getElementById('publishBtn');
        btn.disabled = true;
        apiFetch('/post', {
            method: 'POST', headers: authHeaders({ 'Content-Type': 'application/json' }),
            body: JSON.stringify({ content: text, likes: 0, dislikes: 0 })
        }).then(function (res) {
            if (!res.ok) throw new Error('publish failed');
            textarea.value = '';
            return loadFeed();
        }).catch(function () {
            document.getElementById('statusMsg').textContent = "Échec de la publication.";
        }).finally(function () { btn.disabled = false; });
    });

    loadFeed();
})();
</script>
</body>
</html>
